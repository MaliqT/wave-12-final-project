<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | PTO Tracker</title>

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
    >
    <link rel="stylesheet" href="style.css">
    <script src="contact.js" defer></script>
</head>

<body class="dark-mode">
    <main>
        <nav>
            <div class="sidebar-brand">
                <span class="material-symbols-rounded" aria-hidden="true">
                    eco
                </span>
                <h2>PTO Tracker</h2>
            </div>

            <ul>
                <li>
                    <a href="index.html" id="nav-dashboard">
                        <span class="material-symbols-rounded"
                              aria-hidden="true">
                            home
                        </span>
                        Dashboard
                    </a>
                </li>

                <li>
                    <button type="button" id="nav-calendar">
                        <span class="material-symbols-rounded"
                              aria-hidden="true">
                            calendar_month
                        </span>
                        Calendar
                    </button>
                </li>

                <li>
                    <button type="button" id="nav-settings">
                        <span class="material-symbols-rounded"
                              aria-hidden="true">
                            settings
                        </span>
                        Settings
                    </button>
                </li>
                
                <li class="active">
                    <a href="contact.html"
                       id="nav-contact"
                       aria-current="page">
                        <span class="material-symbols-rounded"
                              aria-hidden="true">
                            mail
                        </span>
                        Contact Us
                    </a>
                </li>
            </ul>

            <div class="sidebar-note">
                <span class="material-symbols-rounded" aria-hidden="true">
                    light_mode
                </span>
                <p>More time for<br>what matters</p>
            </div>
        </nav>

        <div class="dashboard">

            <header class="dashboard-header">
                <div class="header-text">
                    <h1>Contact Us</h1>
                    <p>
                        Have a question, suggestion, or issue?
                        Send us a message.
                    </p>
                </div>
            </header>

            <section class="contact-card">
                <form id="contact-form">

                    <div class="contact-field">
                        <label for="contact-name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="contact-name"
                            name="name"
                            placeholder="Enter your full name"
                            maxlength="100"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="contact-field">
                        <label for="contact-email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="contact-email"
                            name="email"
                            placeholder="example@email.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="contact-field">
                        <label for="contact-subject">
                            Subject
                        </label>

                        <select
                            id="contact-subject"
                            name="subject"
                            required
                        >
                            <option value="" disabled selected>
                                Select a subject
                            </option>
                            <option value="general">
                                General Question
                            </option>
                            <option value="technical">
                                Technical Issue
                            </option>
                            <option value="feedback">
                                Feedback or Suggestion
                            </option>
                            <option value="other">
                                Other
                            </option>
                        </select>
                    </div>

                    <div class="contact-field">
                        <label for="contact-message">
                            Message
                        </label>

                        <textarea
                            id="contact-message"
                            name="message"
                            rows="6"
                            maxlength="2000"
                            placeholder="Write your message here..."
                            required
                        ></textarea>
                    </div>

                    <button
                        type="submit"
                        class="contact-submit-btn"
                    >
                        Send Message
                    </button>

                    <p
                        id="contact-feedback"
                        role="status"
                        aria-live="polite"
                    ></p>

                </form>
            </section>

        </div>
    </main>
</body>
</html>
